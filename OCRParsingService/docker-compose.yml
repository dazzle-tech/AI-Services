version: "3.8"

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-parsing-service
    ports:
      - "8012:8012"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8012}
      - API_RELOAD=${API_RELOAD:-false}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-en}
      - OCR_GPU=${OCR_GPU:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.1}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-120}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-3}
      - OPENAI_RETRY_DELAY=${OPENAI_RETRY_DELAY:-1.0}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
