version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-parsing-service
    ports:
      - "8012:8012"
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8012}
      - API_RELOAD=${API_RELOAD:-false}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-en}
      - OCR_GPU=${OCR_GPU:-false}
      - OLLAMA_COMMAND=${OLLAMA_COMMAND:-ollama}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-120}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
