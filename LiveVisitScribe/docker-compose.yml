services:
  live-visit-scribe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-visit-scribe
    ports:
      - "${PORT:-8037}:8037"
    # Optional: copy .env.example to .env to override anything below.
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8037
      # true = scripted lines, no speech API and no key (demos, wiring checks)
      USE_LLM_STUB: ${USE_LLM_STUB:-false}
      LIVE_TRANSCRIBE_MODEL: ${LIVE_TRANSCRIBE_MODEL:-gpt-live-transcribe}
      LIVE_TRANSCRIBE_DELAY: ${LIVE_TRANSCRIBE_DELAY:-low}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LIVE_EXTRACT_MODEL: ${LIVE_EXTRACT_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENABLE_DEV_PAGES: ${ENABLE_DEV_PAGES:-false}
    volumes:
      - live_visit_scribe_models:/models
    restart: unless-stopped
    mem_limit: 4g
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8037/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  live_visit_scribe_models:
