version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-recommendations-service
    ports:
      - "8007:8007"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
