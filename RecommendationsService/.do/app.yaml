name: clinical-recommendations-service
region: nyc

services:
- name: api
  github:
    repo: your-username/your-repo-name
    branch: main
    deploy_on_push: true
  run_command: uvicorn main:app --host 0.0.0.0 --port 8080
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8080
  routes:
  - path: /
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: OPENAI_MODEL
    value: gpt-4o
  - key: OPENAI_TEMPERATURE
    value: "0.3"
  - key: OPENAI_MAX_TOKENS
    value: "1500"
  - key: OPENAI_TIMEOUT
    value: "30"
  - key: API_HOST
    value: "0.0.0.0"
  - key: API_PORT
    value: "8080"
  - key: API_RELOAD
    value: "false"
  - key: ENABLE_USAGE_TRACKING
    value: "true"
  health_check:
    http_path: /api/v1/health
    initial_delay_seconds: 10
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3




