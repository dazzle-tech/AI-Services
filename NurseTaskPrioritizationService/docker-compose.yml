version: '3.8'

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  api:
    build: .
    container_name: nurse-task-prioritization-service
    ports:
      - "8002:8002"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - API_HOST=0.0.0.0
      - API_PORT=8002
      - API_RELOAD=false
      - ENABLE_USAGE_TRACKING=${ENABLE_USAGE_TRACKING:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
