version: '3.8'

services:
  api:
    build: .
    container_name: clinical-recommendations-service
    ports:
      - "8004:8004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.3}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-1500}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-30}
      - API_HOST=0.0.0.0
      - API_PORT=8004
      - API_RELOAD=false
      - ENABLE_USAGE_TRACKING=${ENABLE_USAGE_TRACKING:-true}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

