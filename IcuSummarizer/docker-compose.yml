version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icu-summarizer-service
    ports:
      - "8013:8013"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8013
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
