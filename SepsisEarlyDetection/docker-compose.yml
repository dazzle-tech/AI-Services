version: '3.8'

services:
  api:
    build: .
    container_name: sepsis-sentinel
    ports:
      - "8016:8016"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-120}
      - API_HOST=0.0.0.0
      - API_PORT=8016
      - API_RELOAD=false
    env_file:
      - .env
    volumes:
      - ./proper_output:/app/proper_output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
