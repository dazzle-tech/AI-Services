version: '3.8'

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  api:
    build: .
    container_name: sepsis-sentinel
    ports:
      - "8023:8023"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-120}
      - API_HOST=0.0.0.0
      - API_PORT=8023
      - API_RELOAD=false
    env_file:
      - .env
    volumes:
      - ./proper_output:/app/proper_output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8023/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
