version: "3.8"

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discharge-report-generator-service
    ports:
      - "8005:8005"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
