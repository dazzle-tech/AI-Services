version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: orscribe-postgres
    environment:
      POSTGRES_USER: orscribe
      POSTGRES_PASSWORD: orscribe
      POSTGRES_DB: orscribe
    ports:
      - "5434:5432"
    volumes:
      - orscribe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orscribe"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orscribe-network

  redis:
    image: redis:7-alpine
    container_name: orscribe-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orscribe-network

  minio:
    image: minio/minio:latest
    container_name: orscribe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - orscribe_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orscribe-network

  api:
    build: .
    container_name: orscribe-api
    ports:
      - "8030:8030"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://orscribe:orscribe@postgres:5432/orscribe
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      TRANSCRIPTION_BACKEND: stub
      USE_LLM_STUB: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - orscribe-network

  worker:
    build: .
    container_name: orscribe-worker
    command: celery -A app.jobs.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://orscribe:orscribe@postgres:5432/orscribe
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      TRANSCRIPTION_BACKEND: stub
      USE_LLM_STUB: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - orscribe-network

  beat:
    build: .
    container_name: orscribe-beat
    command: celery -A app.jobs.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://orscribe:orscribe@postgres:5432/orscribe
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orscribe-network

volumes:
  orscribe_pg_data:
  orscribe_minio_data:

networks:
  orscribe-network:
    driver: bridge
