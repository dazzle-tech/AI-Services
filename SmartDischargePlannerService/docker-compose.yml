version: '3.8'

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  api:
    build: .
    container_name: smart-discharge-planner-service
    ports:
      - "8004:8004"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-1500}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-30}
      - API_HOST=0.0.0.0
      - API_PORT=8004
      - API_RELOAD=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_USAGE_TRACKING=${ENABLE_USAGE_TRACKING:-true}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
