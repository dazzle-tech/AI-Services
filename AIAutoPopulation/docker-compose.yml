version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-auto-population-service
    ports:
      - "8010:8010"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
