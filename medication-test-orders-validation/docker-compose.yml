version: '3.8'

services:
  api:
    build: .
    container_name: medication-test-orders-validation-service
    ports:
      - "8005:8005"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2000}
      - HOST=0.0.0.0
      - PORT=8005
      - DEBUG=false
      - VALIDATION_CONFIDENCE_THRESHOLD=${VALIDATION_CONFIDENCE_THRESHOLD:-0.7}
      - MAX_RETRY_ATTEMPTS=${MAX_RETRY_ATTEMPTS:-3}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-60}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

