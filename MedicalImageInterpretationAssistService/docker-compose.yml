version: "3.8"

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  ollama:
    environment:
      - OLLAMA_MODELS=gpt-4o

  api:
    build: .
    container_name: medical-image-interpretation-assist
    ports:
      - "8015:8015"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - API_HOST=0.0.0.0
      - API_PORT=8015
      - API_RELOAD=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=${SERVICE_NAME:-medical-image-interpretation-assist}
      - DISCLAIMER_TEXT=${DISCLAIMER_TEXT:-Assistive AI only. Radiologist review required. Not for final diagnosis.}
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VISION_MODEL=${VISION_MODEL:-gpt-4o}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network
