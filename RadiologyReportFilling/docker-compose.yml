version: "3.8"

include:
  - path: ../infra/ollama/compose.fragment.yml

services:
  medical-imaging-assist:
    build: .
    container_name: medical-imaging-assist
    ports:
      - "8024:8024"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    networks:
      - app-network